name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg sw.js www/
      - name: Use the fixed signing key (so new APKs install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: Patch Android project (fixed signing, version number, app icon)
        run: |
          python3 - <<'PY'
          import os, re
          p = "android/app/build.gradle"
          s = open(p).read()
          s = re.sub(r"versionCode\s+\d+", "versionCode " + os.environ.get("RUN_NO", "1"), s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "7.' + os.environ.get('RUN_NO', '1') + '"', s, count=1)
          block = '''
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          s = re.sub(r"(android\s*\{)", lambda m: m.group(1) + block, s, count=1)
          open(p, "w").write(s)
          PY
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f icon-$d.png ]; then
              mkdir -p $RES/mipmap-$d
              cp icon-$d.png $RES/mipmap-$d/ic_launcher.png
              cp icon-round-$d.png $RES/mipmap-$d/ic_launcher_round.png
              cp icon-fg-$d.png $RES/mipmap-$d/ic_launcher_foreground.png
            fi
          done
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#2B2B2B</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
        env:
          RUN_NO: ${{ github.run_number }}
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StockBook.apk
      - name: Show signing fingerprint (must be the same in every build)
        run: |
          keytool -printcert -jarfile StockBook.apk | grep -i "SHA256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: StockBook-apk
          path: StockBook.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" StockBook.apk --title "Stock Book v${{ github.run_number }}" --notes "Download StockBook.apk and install on your phone."
