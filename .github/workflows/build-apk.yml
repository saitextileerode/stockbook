name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg sw.js www/
      - name: Use the fixed signing key (so new APKs install over the old app)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - run: npm install
      - run: npx cap add android
      - name: Patch Android project (version number and fixed signing key)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p).read()
          s = re.sub(r"versionCode\s+\d+", "versionCode ${{ github.run_number }}", s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "2.${{ github.run_number }}"', s, count=1)
          sign = """android {
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """
          assert "android {" in s
          s = s.replace("android {", sign, 1)
          open(p, "w").write(s)
          PY
          grep -n "versionCode\|versionName\|storeFile" android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StockBook.apk
      - name: Show the signing fingerprint (should be the same in every build)
        run: |
          keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256" || true
          "$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs StockBook.apk | grep -i "SHA-256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: StockBook-apk
          path: StockBook.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" StockBook.apk --title "Stock Book v${{ github.run_number }}" --notes "Download StockBook.apk and install on your phone."
